<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자 도장 콕! — 8급~4급</title>

<!-- Add to Home Screen -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#f3c9b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한자도장콕">

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --primary: #000000;
    --on-primary: #ffffff;
    --ink: #000000;
    --canvas: #ffffff;
    --surface-soft: #f7f7f5;
    --hairline: #e6e6e6;
    --hairline-soft: #f1f1f1;
    --block-lime: #dceeb1;
    --block-lilac: #c5b0f4;
    --block-cream: #f4ecd6;
    --block-pink: #efd4d4;
    --block-mint: #c8e6cd;
    --block-coral: #f3c9b6;
    --block-navy: #1f1d3d;
    --accent-magenta: #ff3d8b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--canvas);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Screens ---------- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    transition: opacity .25s ease;
  }
  .hidden { display: none !important; }

  /* pause overlays the live (frozen) game screen underneath, so it needs its own opaque backdrop */
  #pause-screen { background: var(--canvas); z-index: 10; }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .modal-card {
    background: var(--block-lime);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 340px;
    text-align: center;
  }
  .modal-card p {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-line;
  }

  h1.title {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .subtitle {
    color: var(--ink);
    font-weight: 400;
    margin: 0 0 28px;
    font-size: clamp(13px, 2.2vw, 16px);
    text-align: center;
    line-height: 1.6;
  }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 10px;
    letter-spacing: 1.5px;
  }

  .mode-grid {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    padding: 11px 22px;
    border-radius: 50px;
    border: 1.5px solid var(--primary);
    background: var(--canvas);
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .mode-btn:active { transform: scale(0.96); }
  .mode-btn.selected {
    background: var(--primary);
    color: var(--on-primary);
  }

  .grade-grid {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .grade-btn {
    width: 68px; height: 44px;
    border-radius: 50px;
    border: 1.5px solid var(--primary);
    background: var(--canvas);
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .grade-btn:active { transform: scale(0.96); }
  .grade-btn.selected {
    background: var(--primary);
    color: var(--on-primary);
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(4, 62px);
    gap: 12px;
    margin-bottom: 28px;
  }
  .level-btn {
    width: 62px; height: 62px;
    border-radius: 9999px;
    border: 1.5px solid var(--primary);
    background: var(--canvas);
    color: var(--ink);
    font-size: 20px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .level-btn:active { transform: scale(0.96); }
  .level-btn.selected {
    background: var(--primary);
    color: var(--on-primary);
  }
  .level-btn.lightning { font-size: 22px; }

  .big-btn {
    font-family: inherit;
    font-size: 18px;
    font-weight: 500;
    padding: 14px 44px;
    border-radius: 50px;
    border: none;
    background: var(--primary);
    color: var(--on-primary);
    cursor: pointer;
    letter-spacing: 0;
    transition: transform .1s ease;
  }
  .big-btn:active { transform: scale(0.96); }

  .rules {
    max-width: 480px;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.8;
    margin: 0 0 22px;
    text-align: left;
    background: var(--block-lime);
    border-radius: 24px;
    padding: 16px 20px;
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    .screen { padding: 16px; }
    .rules {
      font-size: clamp(10.5px, 3.1vw, 13px);
      padding: 14px 12px;
      white-space: normal;
      border-radius: 20px;
    }
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    font-size: 15px;
    z-index: 5;
  }
  #hearts span { font-size: 20px; margin-right: 2px; filter: grayscale(0); }
  #hearts span.lost { filter: grayscale(1) opacity(0.35); }
  #score-wrap { text-align: center; }
  #score { font-size: 22px; font-weight: 700; color: var(--ink); }
  #combo { font-size: 12px; font-weight: 600; color: var(--accent-magenta); height: 14px; }
  #level-indicator { font-size: 13px; font-weight: 400; color: var(--ink); }
  #hud-actions { display: flex; gap: 8px; }
  #pause-btn, #exit-btn {
    background: var(--canvas); border: 1.5px solid var(--primary); color: var(--ink);
    border-radius: 9999px; padding: 5px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  #pause-btn:active, #exit-btn:active { transform: scale(0.96); }

  /* ---------- Clue + timer ---------- */
  #clue-wrap {
    text-align: center;
    padding: 6px 0 10px;
    z-index: 5;
  }
  #clue {
    font-size: clamp(26px, 6vw, 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  #clue .sound { color: var(--ink); font-weight: 400; }
  #clue.hanja-clue {
    font-size: clamp(48px, 12vw, 72px);
    letter-spacing: 0;
  }
  #timer-track {
    width: 70%; max-width: 420px; height: 8px;
    margin: 8px auto 0;
    background: var(--hairline);
    border-radius: 6px;
    overflow: hidden;
  }
  #timer-bar {
    height: 100%; width: 100%;
    background: var(--primary);
    border-radius: 6px;
    transform-origin: left;
  }

  /* ---------- Play area ---------- */
  #play-area {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: var(--canvas);
  }

  .stamp {
    position: absolute;
    width: 78px; height: 78px;
    border-radius: 9999px;
    background: var(--block-lime);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    font-size: 34px;
    font-weight: 700;
    cursor: pointer;
    will-change: transform;
    transition: transform .15s ease;
  }
  .stamp:active { transform: scale(0.96); }
  .stamp.text-mode {
    width: 148px; height: 68px;
    border-radius: 24px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0;
    padding: 0 8px;
    text-align: center;
    line-height: 1.2;
  }
  .stamp.correct-pop {
    animation: pop-stamp .45s ease forwards;
    pointer-events: none;
  }
  .stamp.wrong-crack {
    animation: crack-shake .4s ease forwards;
    pointer-events: none;
  }
  @keyframes pop-stamp {
    0%   { transform: scale(1) rotate(0deg); }
    35%  { transform: scale(1.3) rotate(-6deg); }
    100% { transform: scale(0.2) rotate(4deg); opacity: 0; }
  }
  @keyframes crack-shake {
    0%   { transform: translate(0,0) rotate(0deg); filter: grayscale(0); }
    20%  { transform: translate(-4px,0) rotate(-4deg); }
    40%  { transform: translate(4px,0) rotate(4deg); }
    60%  { transform: translate(-3px,0) rotate(-3deg); }
    100% { transform: translate(0,4px) rotate(0deg); filter: grayscale(0.8); opacity: 0; }
  }

  .ink-splat {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-magenta);
    pointer-events: none;
    animation: splat-fly .55s ease-out forwards;
  }
  @keyframes splat-fly {
    to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  .flash-red {
    animation: flash-red-kf .35s ease;
  }
  @keyframes flash-red-kf {
    0% { background: var(--block-pink); }
    100% { background: transparent; }
  }

  #gameover-screen .stat { font-size: 16px; font-weight: 400; margin: 4px 0; color: var(--ink); }
  #gameover-screen .stat b { color: var(--ink); font-weight: 700; font-size: 20px; }

  footer.hint {
    text-align: center; font-size: 11px; font-weight: 400; color: var(--ink); opacity: 0.5;
    margin-top: 18px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <div id="start-screen" class="screen" style="justify-content:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch;">
    <h1 class="title">한자 도장 콕!</h1>
    <p class="subtitle" id="subtitle">8급~4급 한자 · 위에 뜻과 음이 뜨면,<br>맞는 한자 도장을 찾아 콕 찍어보세요.</p>
    <button class="mode-btn hidden" id="install-btn" style="margin-bottom:18px;">📲 홈 화면에 추가</button>
    <button class="mode-btn hidden" id="mistake-review-btn" style="margin-bottom:18px; background:var(--block-lilac);">
      🔁 틀린 한자 복습 (<span id="mistake-count">0</span>개)
    </button>
    <div class="rules">
      ✅ 정답을 맞추면 점수 획득! 연속으로 맞추면 콤보 보너스!<br>
      ⏰ 문제마다 제한시간이 있어요 (막대가 줄어요)<br>
      ❌ 오답·시간초과 시 하트가&nbsp;줄어요&nbsp;❤️<br>
      🔥 8문제마다 난이도가 올라가요
    </div>
    <p class="section-label">모드 선택</p>
    <div class="mode-grid" id="mode-grid"></div>
    <p class="section-label">급수 선택</p>
    <div class="grade-grid" id="grade-grid"></div>
    <p class="section-label">시작 단계</p>
    <div class="level-grid" id="level-grid"></div>
    <button class="big-btn" id="start-btn">시작하기</button>
    <footer class="hint">로컬 개인용 · 한국어문회 8급~4급 배정한자 1,000자 기준</footer>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden" style="justify-content:flex-start; align-items:stretch; padding:0;">
    <div id="hud">
      <div id="hearts"></div>
      <div id="score-wrap">
        <div id="score">0</div>
        <div id="combo"></div>
      </div>
      <div id="level-indicator">단계 1</div>
      <div id="hud-actions">
        <button id="pause-btn">일시정지</button>
        <button id="exit-btn">종료</button>
      </div>
    </div>
    <div id="clue-wrap">
      <div id="clue">&nbsp;</div>
      <div id="timer-track"><div id="timer-bar"></div></div>
    </div>
    <div id="play-area"></div>
  </div>

  <!-- PAUSE OVERLAY -->
  <div id="pause-screen" class="screen hidden">
    <h1 class="title" style="font-size:32px;">일시정지</h1>
    <button class="big-btn" id="resume-btn">계속하기</button>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="gameover-screen" class="screen hidden">
    <h1 class="title">게임 종료</h1>
    <div class="stat">최종 점수 <b id="final-score">0</b></div>
    <div class="stat">최고 콤보 <b id="final-combo">0</b></div>
    <div class="stat">도달 단계 <b id="final-level">1</b></div>
    <button class="big-btn" id="restart-btn" style="margin-top:20px;">다시하기</button>
    <button class="mode-btn hidden" id="review-btn" style="margin-top:12px; padding:11px 28px; font-size:16px;">
      틀린 문제 복습하기 (<span id="missed-count">0</span>개)
    </button>
    <button class="mode-btn" id="share-result-btn" style="margin-top:12px; padding:11px 28px; font-size:16px;">📸 결과 저장/공유</button>
    <button class="mode-btn" id="gameover-home-btn" style="margin-top:12px; padding:11px 28px; font-size:16px;">🏠 홈으로</button>
  </div>

  <!-- REVIEW DONE SCREEN -->
  <div id="review-done-screen" class="screen hidden">
    <h1 class="title">복습 완료! 🎉</h1>
    <div class="stat">복습한 문제 <b id="review-done-count">0</b>개</div>
    <button class="big-btn" id="review-again-btn" style="margin-top:20px;">다시 복습하기</button>
    <button class="mode-btn" id="review-home-btn" style="margin-top:12px; padding:11px 28px; font-size:16px;">처음으로</button>
  </div>

  <!-- INSTALL HELP MODAL -->
  <div id="install-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <p id="install-modal-text"></p>
      <button class="big-btn" id="install-modal-close" style="padding:10px 28px; font-size:15px;">확인</button>
    </div>
  </div>
</div>

/* ============ 유틸 ============ */
function rand(min, max) { return Math.random() * (max - min) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Picks `count` distractors from `pool`, excluding `answer`'s hanja AND any entry that
// shares `answer`'s 뜻/음 text (e.g. 現/顯 both read "나타날 현") to avoid ambiguous choices.
function buildDistractors(pool, answer, count) {
  const answerText = answer[1] + " " + answer[2];
  const rest = pool.filter(h => h[0] !== answer[0] && (h[1] + " " + h[2]) !== answerText);
  const distractors = [];
  const usedIdx = new Set();
  const usedTexts = new Set([answerText]);
  let attempts = 0;
  while (distractors.length < count && distractors.length < rest.length && attempts < rest.length * 5) {
    attempts++;
    const idx = Math.floor(Math.random() * rest.length);
    if (usedIdx.has(idx)) continue;
    const candidate = rest[idx];
    const text = candidate[1] + " " + candidate[2];
    if (usedTexts.has(text)) continue; // avoid two distractors sharing the same 뜻/음 text
    usedIdx.add(idx);
    usedTexts.add(text);
    distractors.push(candidate);
  }
  return distractors;
}

function pickQuestion() {
  const answer = pick(state.pool);
  const cfg = LEVELS[state.level];
  const distractors = buildDistractors(state.pool, answer, cfg.choices - 1);
  const all = shuffle([answer, ...distractors]);
  return { answer, all, cfg };
}

// Review mode: work through state.reviewQueue (the missed hanja from the last game)
// one at a time, sourcing distractors from the broader grade pool. Relaxed — no timer, no hearts.
function pickReviewQuestion() {
  const answer = state.reviewQueue.shift();
  const choices = 4;
  const distractors = buildDistractors(state.pool, answer, choices - 1);
  const all = shuffle([answer, ...distractors]);
  const cfg = { choices: all.length, time: 0, speed: [12, 18] };
  return { answer, all, cfg };
}

/* ============ 게임 시작 ============ */
function startGame() {
  state.mode = state.startMode;
  state.grade = state.startGrade;
  state.pool = HANJA.slice(0, GRADE_BOUNDARIES[state.grade]);
  state.level = state.startLevel;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.hearts = 3;
  state.correctStreak = 0;
  state.missed = [];
  state.reviewMode = false;

  startScreen.classList.add("hidden");
  gameoverScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  state.running = true;

  updateHUD();
  nextQuestion();
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.lastTs = null;
  state.rafId = requestAnimationFrame(tick);
}

/* ============ 틀린 문제 복습 ============ */
function startReview() {
  state.reviewMode = true;
  state.reviewSource = "session";
  state.reviewQueue = shuffle(state.missed.slice());
  state.reviewTotal = state.reviewQueue.length;
  state.combo = 0;
  state.maxCombo = 0;
  state.correctStreak = 0;

  gameoverScreen.classList.add("hidden");
  reviewDoneScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  state.running = true;

  updateHUD();
  nextQuestion();
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.lastTs = null;
  state.rafId = requestAnimationFrame(tick);
}

// 시작 화면의 "틀린 한자 복습" — localStorage에 누적된, 지금까지 틀린 적 있는 모든 한자를 복습
function startMistakeReview() {
  const entries = Object.values(loadMistakes());
  if (entries.length === 0) {
    reviewDoneScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
    refreshMistakeMenu();
    return;
  }

  state.reviewMode = true;
  state.reviewSource = "persistent";
  state.pool = HANJA;
  state.reviewQueue = shuffle(entries);
  state.reviewTotal = state.reviewQueue.length;
  state.combo = 0;
  state.maxCombo = 0;
  state.correctStreak = 0;

  startScreen.classList.add("hidden");
  reviewDoneScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  state.running = true;

  updateHUD();
  nextQuestion();
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.lastTs = null;
  state.rafId = requestAnimationFrame(tick);
}

function endReview() {
  state.running = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  gameScreen.classList.add("hidden");
  reviewDoneScreen.classList.remove("hidden");
  $("review-done-count").textContent = state.reviewTotal;
}

function updateHUD() {
  if (state.reviewMode) {
    const current = state.reviewTotal - state.reviewQueue.length;
    heartsEl.innerHTML = '<span style="font-size:14px;font-weight:600;">🔁 복습 모드</span>';
    scoreEl.textContent = `${current} / ${state.reviewTotal}`;
    comboEl.textContent = "";
    levelIndicator.textContent = "";
    return;
  }
  scoreEl.textContent = state.score;
  comboEl.textContent = state.combo >= 2 ? `🔥 ${state.combo} 콤보` : "";
  const levelLabel = state.level === 12 ? "⚡ 번개" : state.level;
  levelIndicator.textContent = `${state.grade}급 · 단계 ${levelLabel}`;
  heartsEl.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const s = document.createElement("span");
    s.textContent = "❤️";
    if (i >= state.hearts) s.classList.add("lost");
    heartsEl.appendChild(s);
  }
}

/* ============ 문제 출제 ============ */
function nextQuestion() {
  if (state.reviewMode && state.reviewQueue.length === 0) {
    endReview();
    return;
  }

  playArea.innerHTML = "";
  state.stamps = [];

  const { answer, all, cfg } = state.reviewMode ? pickReviewQuestion() : pickQuestion();
  state.answer = answer;
  state.qTotalTime = cfg.time;
  state.qElapsed = 0;

  const isReverse = state.mode === "hanja2word";
  clueEl.classList.toggle("hanja-clue", isReverse);
  if (isReverse) {
    clueEl.textContent = answer[0];
  } else {
    clueEl.innerHTML = `${answer[1]} <span class="sound">${answer[2]}</span>`;
  }

  state.stampW = isReverse ? TEXT_STAMP_W : STAMP_SIZE;
  state.stampH = isReverse ? TEXT_STAMP_H : STAMP_SIZE;

  timerTrack.style.display = state.reviewMode ? "none" : "";
  if (!state.reviewMode) {
    timerBar.style.transition = "none";
    timerBar.style.transform = "scaleX(1)";
    // force reflow so the next transition applies cleanly
    void timerBar.offsetWidth;
    timerBar.style.transition = `transform ${cfg.time}s linear`;
    requestAnimationFrame(() => { timerBar.style.transform = "scaleX(0)"; });
  }

  updateHUD();

  const areaW = playArea.clientWidth;
  const areaH = playArea.clientHeight;
  const placed = [];
  const w = state.stampW, h = state.stampH;
  const spacing = Math.max(w, h) * 0.85;

  const palette = [
    "var(--block-lime)", "var(--block-lilac)", "var(--block-cream)",
    "var(--block-pink)", "var(--block-mint)", "var(--block-coral)",
  ];
  const shuffledPalette = palette.slice().sort(() => Math.random() - 0.5);

  all.forEach((entry, i) => {
    const el = document.createElement("div");
    el.className = "stamp" + (isReverse ? " text-mode" : "");
    el.textContent = isReverse ? `${entry[1]} ${entry[2]}` : entry[0];
    el.style.background = shuffledPalette[i % shuffledPalette.length];

    let x, y, tries = 0;
    do {
      x = rand(4, Math.max(4, areaW - w - 4));
      y = rand(4, Math.max(4, areaH - h - 4));
      tries++;
    } while (tries < 30 && placed.some(p => Math.hypot(p.x - x, p.y - y) < spacing));
    placed.push({ x, y });

    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.transform = `rotate(${rand(isReverse ? -4 : -10, isReverse ? 4 : 10)}deg)`;
    playArea.appendChild(el);

    const angle = rand(0, Math.PI * 2);
    const speed = rand(cfg.speed[0], cfg.speed[1]);
    const stamp = {
      el, hanja: entry[0], x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    };
    el.addEventListener("click", (ev) => onStampClick(stamp, ev));
    state.stamps.push(stamp);
  });
}

/* ============ 클릭 처리 ============ */
function onStampClick(stamp, ev) {
  if (!state.running || state.paused) return;
  if (!state.stamps.includes(stamp)) return;

  if (stamp.hanja === state.answer[0]) {
    handleCorrect(stamp, ev);
  } else {
    handleWrong(stamp, ev);
  }
}

function handleCorrect(stamp, ev) {
  if (state.reviewMode) removeMistake(state.answer[0]);

  state.combo++;
  state.maxCombo = Math.max(state.maxCombo, state.combo);
  state.score += 10 + state.combo * 2;
  state.correctStreak++;

  if (state.correctStreak % 8 === 0 && state.level < 12) {
    state.level++;
  }

  stamp.el.classList.add("correct-pop");
  spawnInkSplat(stamp.el, "#ff3d8b");
  removeStamp(stamp);
  updateHUD();

  setTimeout(() => {
    if (state.running && !state.paused) nextQuestion();
  }, 260);
}

/* ============ 틀린 한자 영구 저장 (간격 반복용) ============ */
const MISTAKE_KEY = "hanjaMistakes";

function loadMistakes() {
  try { return JSON.parse(localStorage.getItem(MISTAKE_KEY) || "{}"); } catch { return {}; }
}

function addMistake(entry) {
  const store = loadMistakes();
  store[entry[0]] = entry;
  localStorage.setItem(MISTAKE_KEY, JSON.stringify(store));
  refreshMistakeMenu();
}

function removeMistake(hanja) {
  const store = loadMistakes();
  if (!(hanja in store)) return;
  delete store[hanja];
  localStorage.setItem(MISTAKE_KEY, JSON.stringify(store));
  refreshMistakeMenu();
}

function refreshMistakeMenu() {
  const count = Object.keys(loadMistakes()).length;
  $("mistake-count").textContent = count;
  $("mistake-review-btn").classList.toggle("hidden", count === 0);
}

function trackMissed(entry) {
  addMistake(entry);
  if (state.missed.some(e => e[0] === entry[0])) return;
  state.missed.push(entry);
}

function handleWrong(stamp, ev) {
  state.combo = 0;
  if (!state.reviewMode) {
    state.hearts--;
    trackMissed(state.answer);
  }
  updateHUD();
  stamp.el.classList.add("wrong-crack");
  spawnInkSplat(stamp.el, "#000000");
  flashScreen();
  removeStamp(stamp);

  if (!state.reviewMode && state.hearts <= 0) {
    endGame();
  }
}

function removeStamp(stamp) {
  const idx = state.stamps.indexOf(stamp);
  if (idx >= 0) state.stamps.splice(idx, 1);
  setTimeout(() => stamp.el.remove(), 450);
}

function flashScreen() {
  playArea.classList.remove("flash-red");
  void playArea.offsetWidth;
  playArea.classList.add("flash-red");
}

function spawnInkSplat(anchorEl, color) {
  const rect = anchorEl.getBoundingClientRect();
  const parentRect = playArea.getBoundingClientRect();
  const cx = rect.left - parentRect.left + rect.width / 2;
  const cy = rect.top - parentRect.top + rect.height / 2;
  for (let i = 0; i < 8; i++) {
    const d = document.createElement("div");
    d.className = "ink-splat";
    d.style.left = cx + "px";
    d.style.top = cy + "px";
    d.style.background = color;
    const angle = rand(0, Math.PI * 2);
    const dist = rand(20, 60);
    d.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    d.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    playArea.appendChild(d);
    setTimeout(() => d.remove(), 600);
  }
}

/* ============ 타이머 초과 처리 ============ */
function handleTimeout() {
  state.combo = 0;
  state.hearts--;
  trackMissed(state.answer);
  updateHUD();
  flashScreen();
  if (state.hearts <= 0) {
    endGame();
  } else {
    nextQuestion();
  }
}

/* ============ 메인 루프 ============ */
function tick(ts) {
  if (!state.running) return;
  state.rafId = requestAnimationFrame(tick);
  if (state.paused) { state.lastTs = null; return; }

  if (state.lastTs === null) state.lastTs = ts;
  const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
  state.lastTs = ts;

  const areaH = playArea.clientHeight;
  const areaW = playArea.clientWidth;
  const maxX = Math.max(0, areaW - state.stampW);
  const maxY = Math.max(0, areaH - state.stampH);

  state.stamps.forEach(s => {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.x < 0) { s.x = 0; s.vx = Math.abs(s.vx); }
    if (s.x > maxX) { s.x = maxX; s.vx = -Math.abs(s.vx); }
    if (s.y < 0) { s.y = 0; s.vy = Math.abs(s.vy); }
    if (s.y > maxY) { s.y = maxY; s.vy = -Math.abs(s.vy); }
  });

  // 도장끼리 겹치면 서로 튕겨냄
  for (let i = 0; i < state.stamps.length; i++) {
    for (let j = i + 1; j < state.stamps.length; j++) {
      const a = state.stamps[i], b = state.stamps[j];
      const overlapX = state.stampW - Math.abs(a.x - b.x);
      const overlapY = state.stampH - Math.abs(a.y - b.y);
      if (overlapX > 0 && overlapY > 0) {
        if (overlapX < overlapY) {
          const push = overlapX / 2;
          if (a.x < b.x) { a.x -= push; b.x += push; } else { a.x += push; b.x -= push; }
          const tmp = a.vx; a.vx = b.vx; b.vx = tmp;
        } else {
          const push = overlapY / 2;
          if (a.y < b.y) { a.y -= push; b.y += push; } else { a.y += push; b.y -= push; }
          const tmp = a.vy; a.vy = b.vy; b.vy = tmp;
        }
        a.x = Math.min(Math.max(a.x, 0), maxX);
        b.x = Math.min(Math.max(b.x, 0), maxX);
        a.y = Math.min(Math.max(a.y, 0), maxY);
        b.y = Math.min(Math.max(b.y, 0), maxY);
      }
    }
  }

  state.stamps.forEach(s => {
    s.el.style.left = s.x + "px";
    s.el.style.top = s.y + "px";
  });

  if (!state.reviewMode) {
    state.qElapsed += dt;
    if (state.qElapsed >= state.qTotalTime) {
      state.qElapsed = -9999; // guard against double-trigger
      handleTimeout();
    }
  }
}

/* ============ 게임 종료 ============ */
function endGame() {
  state.running = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  gameScreen.classList.add("hidden");
  gameoverScreen.classList.remove("hidden");
  $("final-score").textContent = state.score;
  $("final-combo").textContent = state.maxCombo;
  $("final-level").textContent = state.level === 12 ? "⚡ 번개" : state.level;

  const reviewBtn = $("review-btn");
  if (state.missed.length > 0) {
    $("missed-count").textContent = state.missed.length;
    reviewBtn.classList.remove("hidden");
  } else {
    reviewBtn.classList.add("hidden");
  }
}

/* ============ 결과 저장 / 공유 ============ */
async function buildResultImage() {
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }

  const W = 800, H = 1000;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const sans = (weight, size) => `${weight} ${size}px Pretendard, -apple-system, sans-serif`;

  // background
  ctx.fillStyle = "#f3c9b6"; // block-coral
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#000000";
  ctx.textAlign = "center";

  ctx.font = sans(700, 40);
  ctx.fillText("한자 도장 콕!", W / 2, 130);

  ctx.font = sans(400, 24);
  const levelLabel = state.level === 12 ? "⚡ 번개" : `단계 ${state.level}`;
  ctx.fillText(`${state.grade}급 · ${levelLabel} · ${MODES[state.mode].label}`, W / 2, 175);

  // score block (white rounded card)
  const cardX = 80, cardY = 240, cardW = W - 160, cardH = 430, radius = 32;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.moveTo(cardX + radius, cardY);
  ctx.arcTo(cardX + cardW, cardY, cardX + cardW, cardY + cardH, radius);
  ctx.arcTo(cardX + cardW, cardY + cardH, cardX, cardY + cardH, radius);
  ctx.arcTo(cardX, cardY + cardH, cardX, cardY, radius);
  ctx.arcTo(cardX, cardY, cardX + cardW, cardY, radius);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#000000";
  ctx.font = sans(500, 26);
  ctx.fillText("최종 점수", W / 2, cardY + 80);
  ctx.font = sans(700, 110);
  ctx.fillText(String(state.score), W / 2, cardY + 210);

  ctx.font = sans(500, 26);
  ctx.fillText(`최고 콤보 🔥 ${state.maxCombo}   ·   틀린 문제 ${state.missed.length}개`, W / 2, cardY + 280);

  ctx.font = sans(400, 20);
  ctx.fillStyle = "#525252";
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}`;
  ctx.fillText(dateStr, W / 2, cardY + 340);

  // footer invite
  ctx.fillStyle = "#000000";
  ctx.font = sans(600, 26);
  ctx.fillText("나도 한자 도장 콕! 하러 가기 👉", W / 2, H - 110);
  ctx.font = sans(500, 26);
  ctx.fillText(location.host || "hanja-nori.vercel.app", W / 2, H - 65);

  return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
}

$("share-result-btn").addEventListener("click", async () => {
  const btn = $("share-result-btn");
  const originalLabel = btn.textContent;
  btn.textContent = "이미지 만드는 중...";
  btn.disabled = true;

  try {
    const blob = await buildResultImage();
    const fileName = "hanja-nori-result.png";
    const file = new File([blob], fileName, { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: "한자 도장 콕! 결과",
        text: `한자 도장 콕! 점수 ${state.score}점 찍었어요 🎉`,
      });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }
  } catch (err) {
    if (err && err.name !== "AbortError") {
      console.error(err);
    }
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
});

refreshMistakeMenu();
</script>
